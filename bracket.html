<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>比赛对战图 · 双败赛制 · 12队</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: linear-gradient(160deg, #0f1024 0%, #1c1540 45%, #101a30 100%);
    color: #f2f0ff; min-height: 100vh; padding: 16px 12px 60px;
  }
  h1 { font-size: 24px; text-align: center; margin: 8px 0 4px; letter-spacing: 2px; }
  .sub { text-align: center; font-size: 12px; color: #9d94c9; margin-bottom: 6px; }
  .toolbar { text-align:center; margin-bottom: 14px; font-size:12px; color:#a99fd4; }
  .toolbar .role { cursor:pointer; text-decoration:underline; color:#ffd86b; margin:0 4px; }
  .status { text-align:center; font-size:12px; min-height:16px; margin-bottom:8px; }
  .status.err { color:#ff8ba0; } .status.ok { color:#7ee6b0; }

  .scroll { overflow-x:auto; padding-bottom:12px; -webkit-overflow-scrolling:touch; }
  .bracket { display:flex; gap:26px; min-width:max-content; padding: 4px 8px; }
  .col { display:flex; flex-direction:column; justify-content:center; gap:14px; min-width:190px; }
  .col-title { font-size:12px; font-weight:700; color:#bfb6e8; text-align:center; margin-bottom:2px; letter-spacing:1px; }

  .section-label {
    margin: 22px 0 6px; font-size:14px; font-weight:700; letter-spacing:2px;
    padding-left:8px; border-left:3px solid #a24bff; color:#e6e1ff;
  }
  .section-label.lb { border-color:#ff5f9e; }
  .section-label.qf { border-color:#5bc8ff; }
  .section-label.rr { border-color:#ffd86b; }
  .section-label.final { border-color:#7ee6b0; }
  .note { font-size:11px; color:#8e85b8; margin:0 0 8px 8px; }

  .match {
    background: rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.12);
    border-radius:10px; overflow:hidden; width:190px;
  }
  .match .mid { font-size:10px; color:#8078a8; padding:3px 8px 0; }
  .team {
    display:flex; align-items:center; justify-content:space-between;
    padding:8px 10px; cursor:pointer; border-top:1px solid rgba(255,255,255,0.06);
    font-size:14px; transition:background .15s;
  }
  .team:first-of-type { border-top:none; }
  .team:hover { background: rgba(255,255,255,0.08); }
  .team .nm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:118px; }
  .team .sc { font-weight:700; color:#ffd86b; min-width:20px; text-align:right; }
  .team.win { background: rgba(126,230,176,0.14); }
  .team.win .nm { color:#7ee6b0; font-weight:700; }
  .team.lose { opacity:.5; }
  .team.tbd .nm { color:#6d648f; font-style:italic; }
  .team.ov { box-shadow: inset 3px 0 0 #5bc8ff; }

  /* 拖拽 */
  .team.draggable { cursor:grab; }
  .team.draggable:active { cursor:grabbing; }
  .team.dragging { opacity:.4; }
  .team.dropok { outline:2px dashed #5bc8ff; outline-offset:-2px; background:rgba(91,200,255,0.15); }
  .team.picked { outline:2px solid #ffd86b; outline-offset:-2px; background:rgba(255,216,107,0.18); }
  body.movemode .team[data-slot] { cursor:pointer; }

  .win-btn {
    display:block; text-align:center; font-size:11px; padding:5px;
    background:rgba(162,75,255,0.25); color:#e6d9ff; cursor:pointer; user-select:none;
    border-top:1px solid rgba(255,255,255,0.08);
  }
  .win-btn:hover { background:rgba(162,75,255,0.45); }

  .undo-btn {
    display:block; text-align:center; font-size:11px; padding:5px;
    background:rgba(255,95,158,0.22); color:#ffc4d8; cursor:pointer; user-select:none;
    border-top:1px solid rgba(255,255,255,0.08);
  }
  .undo-btn:hover { background:rgba(255,95,158,0.4); }

  .rr-wrap { display:flex; flex-wrap:wrap; gap:14px; }
  .rr-standings {
    background:rgba(255,216,107,0.06); border:1px solid rgba(255,216,107,0.3);
    border-radius:12px; padding:12px 14px; min-width:230px;
  }
  .rr-standings h3 { margin:0 0 8px; font-size:13px; color:#ffd86b; }
  .rr-standings table { width:100%; border-collapse:collapse; font-size:13px; }
  .rr-standings td, .rr-standings th { padding:4px 6px; text-align:left; }
  .rr-standings th { color:#a99fd4; font-weight:500; font-size:11px; border-bottom:1px solid rgba(255,255,255,0.1); }
  .rr-standings tr.qual td { color:#7ee6b0; font-weight:700; }

  .champ { font-size:20px; }

  .overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .overlay.show { display:flex; }
  .modal { background:#211a3d; border:1px solid rgba(255,255,255,0.15); border-radius:16px; padding:20px; width:100%; max-width:360px; }
  .modal h2 { margin:0 0 4px; font-size:18px; }
  .modal .grp { font-size:12px; color:#9d94c9; margin-bottom:14px; }
  .modal ul { list-style:none; margin:0 0 16px; padding:0; }
  .modal li { padding:7px 12px; background:rgba(255,255,255,0.05); border-radius:8px; margin-bottom:6px; font-size:15px; }
  .modal label { font-size:12px; color:#bfb6e8; display:block; margin-bottom:6px; }
  .modal input { width:100%; padding:11px 12px; font-size:15px; border-radius:10px; border:1px solid rgba(255,255,255,0.2); background:rgba(0,0,0,0.3); color:#fff; outline:none; }
  .modal input:focus { border-color:#8d7bff; }
  .modal .btns { display:flex; gap:10px; margin-top:14px; }
  .modal button { flex:1; padding:12px; border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; }
  .modal .save { background:linear-gradient(135deg,#a24bff,#5b6bff); color:#fff; }
  .modal .cancel { background:rgba(255,255,255,0.1); color:#cfc6f7; }
  .modal .hint { font-size:11px; color:#8078a8; margin-top:10px; text-align:center; }
</style>
</head>
<body>
  <h1>比赛对战图</h1>
  <div class="sub">双败赛制 · 12 支队伍 · 交叉赛 → 三队循环 → 决赛</div>
  <div class="toolbar">
    <span id="roleLabel">观众模式</span>
    <span class="role" id="roleToggle">切换裁判模式</span>
    <span class="role" id="moveToggle" style="display:none">搬移模式：关</span>
    <span class="role" id="refreshBtn">刷新</span>
    <span class="role" id="clearOvBtn" style="display:none">清除手动调位</span>
  </div>
  <div class="status" id="status"></div>

  <div id="app"></div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <h2 id="mTitle">队伍</h2>
      <div class="grp" id="mGrp"></div>
      <ul id="mMembers"></ul>
      <label>战队名字（大家都能看到）</label>
      <input type="text" id="mNameInput" maxlength="16" placeholder="给你的队伍起个名~">
      <div class="btns">
        <button class="cancel" id="mCancel">关闭</button>
        <button class="save" id="mSave">保存队名</button>
      </div>
      <div class="hint">任何人都能改本队队名，请友好使用~</div>
    </div>
  </div>

<script>
// ===== 配置 =====
const SB_URL = "https://hdcdutjlkwfaqjgewaid.supabase.co";
const SB_KEY = "sb_publishable_27LcCyW8osvSIhV5wkSUIA_FdDqY3C6";
const REST = SB_URL + "/rest/v1";
const H = { "apikey":SB_KEY, "Authorization":"Bearer "+SB_KEY, "Content-Type":"application/json" };
const JUDGE_PIN = "8888";

// ===== 赛程结构 =====
// 胜者组：12队 -> R1(6场) -> R2(3场) -> 胜者组3队
// 败者组：吃掉所有输家 -> 败者组3队
// 交叉赛 QF：胜者组3队 vs 败者组3队（3场）-> 3个胜者
// 半决赛：3队循环（3场）-> 前2名
// 决赛：1v1
const MATCHES = [
  {id:"WB1-1", a:{fixed:1},  b:{fixed:2}},
  {id:"WB1-2", a:{fixed:3},  b:{fixed:4}},
  {id:"WB1-3", a:{fixed:5},  b:{fixed:6}},
  {id:"WB1-4", a:{fixed:7},  b:{fixed:8}},
  {id:"WB1-5", a:{fixed:9},  b:{fixed:10}},
  {id:"WB1-6", a:{fixed:11}, b:{fixed:12}},

  {id:"WB2-1", a:{from:"WB1-1",r:"W"}, b:{from:"WB1-2",r:"W"}},
  {id:"WB2-2", a:{from:"WB1-3",r:"W"}, b:{from:"WB1-4",r:"W"}},
  {id:"WB2-3", a:{from:"WB1-5",r:"W"}, b:{from:"WB1-6",r:"W"}},

  // 败者组R1：WB1 的 6 个败者
  {id:"LB1-1", a:{from:"WB1-1",r:"L"}, b:{from:"WB1-2",r:"L"}},
  {id:"LB1-2", a:{from:"WB1-3",r:"L"}, b:{from:"WB1-4",r:"L"}},
  {id:"LB1-3", a:{from:"WB1-5",r:"L"}, b:{from:"WB1-6",r:"L"}},
  // 败者组R2：LB1胜者 vs WB2败者
  {id:"LB2-1", a:{from:"LB1-1",r:"W"}, b:{from:"WB2-1",r:"L"}},
  {id:"LB2-2", a:{from:"LB1-2",r:"W"}, b:{from:"WB2-2",r:"L"}},
  {id:"LB2-3", a:{from:"LB1-3",r:"W"}, b:{from:"WB2-3",r:"L"}},

  // 交叉赛（胜者组3队 vs 败者组3队），默认 胜1v败1 / 胜2v败2 / 胜3v败3
  {id:"QF-1", a:{from:"WB2-1",r:"W"}, b:{from:"LB2-1",r:"W"}},
  {id:"QF-2", a:{from:"WB2-2",r:"W"}, b:{from:"LB2-2",r:"W"}},
  {id:"QF-3", a:{from:"WB2-3",r:"W"}, b:{from:"LB2-3",r:"W"}},
];

// 半决赛3队 = QF三场胜者
const SEMI_SRC = [
  {from:"QF-1", label:"交叉赛1胜者"},
  {from:"QF-2", label:"交叉赛2胜者"},
  {from:"QF-3", label:"交叉赛3胜者"},
];
// 循环赛3场（用 semi 索引）
const RR = [
  {id:"RR-1", ai:0, bi:1},
  {id:"RR-2", ai:0, bi:2},
  {id:"RR-3", ai:1, bi:2},
];
const FINAL_ID = "FINAL";

// ===== 状态 =====
let TEAMS = {}, RESULTS = {}, MEMBERS = {}, OV = {};
let isJudge = false;
let moveMode = false;    // 搬移模式（触屏友好）
let moveSrc = null;      // 选中的源 slotKey

const $ = id => document.getElementById(id);
function setStatus(t,c){ const s=$("status"); s.textContent=t||""; s.className="status "+(c||""); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }
function teamName(g){ return (TEAMS[g] && String(TEAMS[g]).trim()) ? TEAMS[g] : ("第"+g+"组"); }
function mOf(id){ return MATCHES.find(x=>x.id===id); }

// 解析槽位：手动覆盖优先，否则顺着结果链推导
function slotTeam(mid, side){
  const k = mid+":"+side;
  if(OV[k]!=null) return OV[k];
  if(mid===FINAL_ID){ const st=rrStandings(); const i=(side==="a"?0:1); return st[i]?st[i].g:null; }
  const rr = RR.find(x=>x.id===mid);
  if(rr){ const s=semiTeams(); return s[side==="a"?rr.ai:rr.bi]; }
  const m = mOf(mid); if(!m) return null;
  return resolveSlot(m[side]);
}
function resolveSlot(slot){
  if(!slot) return null;
  if(slot.fixed!=null) return slot.fixed;
  if(slot.from){
    const res = RESULTS[slot.from];
    if(!res || res.winner==null) return null;
    if(slot.r==="W") return res.winner;
    // 求败者：需知道该场两队
    const ga = slotTeam(slot.from,"a"), gb = slotTeam(slot.from,"b");
    if(ga==null||gb==null) return null;
    return (res.winner===ga)?gb:ga;
  }
  return null;
}
function semiTeams(){
  return SEMI_SRC.map(s=>{
    const k = "SEMI:"+s.from;
    if(OV[k]!=null) return OV[k];
    const r = RESULTS[s.from];
    return (r && r.winner!=null) ? r.winner : null;
  });
}
function rrStandings(){
  const s = semiTeams(), pts = {};
  s.forEach(g=>{ if(g!=null) pts[g]={g,w:0,l:0}; });
  RR.forEach(m=>{
    const res = RESULTS[m.id];
    const ga = slotTeam(m.id,"a"), gb = slotTeam(m.id,"b");
    if(res && res.winner!=null && ga!=null && gb!=null){
      const lo = (res.winner===ga)?gb:ga;
      if(pts[res.winner]) pts[res.winner].w++;
      if(pts[lo]) pts[lo].l++;
    }
  });
  return Object.values(pts).sort((a,b)=> b.w-a.w || a.l-b.l);
}

// ===== 渲染 =====
function matchHtml(mid, title){
  const ga = slotTeam(mid,"a"), gb = slotTeam(mid,"b");
  const res = RESULTS[mid] || {};
  const win = res.winner;
  function row(g, side){
    const k = mid+":"+side;
    const ovCls = (OV[k]!=null) ? " ov" : "";
    const selCls = (moveSrc===k) ? " picked" : "";
    const dragCls = (isJudge && !moveMode) ? " draggable" : "";
    if(g==null) return `<div class="team tbd${dragCls}${selCls}" data-slot="${k}"><span class="nm">待定</span><span class="sc">-</span></div>`;
    const cls = win!=null ? (win===g?"win":"lose") : "";
    return `<div class="team ${cls}${ovCls}${dragCls}${selCls}" data-slot="${k}" data-group="${g}" ${(isJudge&&!moveMode)?'draggable="true"':''}>
      <span class="nm">${esc(teamName(g))}</span><span class="sc">${win===g?"✓":""}</span></div>`;
  }
  let btns="";
  if(isJudge && ga!=null && gb!=null){
    if(win!=null){
      // 已判过胜负 -> 显示撤销
      btns = `<div class="undo-btn" data-mid="${mid}">↩ 撤销本场（选错了点这里）</div>`;
    } else {
      btns = `<div class="win-btn" data-mid="${mid}" data-win="${ga}">${esc(teamName(ga))} 胜</div>
              <div class="win-btn" data-mid="${mid}" data-win="${gb}">${esc(teamName(gb))} 胜</div>`;
    }
  }
  return `<div class="match"><div class="mid">${title||mid}</div>${row(ga,"a")}${row(gb,"b")}${btns}</div>`;
}
function colOf(title, ids, labels){
  return `<div class="col"><div class="col-title">${title}</div>` +
    ids.map((id,i)=>matchHtml(id, labels?labels[i]:null)).join("") + `</div>`;
}

function render(){
  let html = "";

  html += `<div class="section-label">胜者组 Winners Bracket</div>`;
  html += `<div class="scroll"><div class="bracket">`;
  html += colOf("第一轮", ["WB1-1","WB1-2","WB1-3","WB1-4","WB1-5","WB1-6"]);
  html += colOf("第二轮 → 胜者组3强", ["WB2-1","WB2-2","WB2-3"]);
  html += `</div></div>`;

  html += `<div class="section-label lb">败者组 Losers Bracket</div>`;
  html += `<div class="scroll"><div class="bracket">`;
  html += colOf("败者组第一轮", ["LB1-1","LB1-2","LB1-3"]);
  html += colOf("败者组第二轮 → 败者组3强", ["LB2-1","LB2-2","LB2-3"]);
  html += `</div></div>`;

  html += `<div class="section-label qf">交叉赛 · 胜者组3强 VS 败者组3强</div>`;
  html += `<div class="note">默认配对：胜者组1v败者组1、胜者组2v败者组2、胜者组3v败者组3${isJudge?"（裁判模式可拖动队伍改配对）":""}</div>`;
  html += `<div class="scroll"><div class="bracket">`;
  html += colOf("三场对决 → 决出半决赛3队", ["QF-1","QF-2","QF-3"]);
  html += `</div></div>`;

  html += `<div class="section-label rr">半决赛 · 三队循环赛</div>`;
  const semis = semiTeams();
  html += `<div class="note">三强：` + semis.map((g,i)=>
    `${SEMI_SRC[i].label} = ${g!=null?esc(teamName(g)):"待定"}`).join(" · ") + `</div>`;
  html += `<div class="scroll"><div class="rr-wrap">`;
  html += `<div class="col">` + RR.map(m=>matchHtml(m.id)).join("") + `</div>`;
  const st = rrStandings();
  let rows = st.map((r,i)=>`<tr class="${i<2?'qual':''}"><td>${i+1}</td><td>${esc(teamName(r.g))}</td><td>${r.w}</td><td>${r.l}</td></tr>`).join("");
  if(!rows) rows = `<tr><td colspan="4" style="color:#6d648f">等交叉赛打完产生三强…</td></tr>`;
  html += `<div class="rr-standings"><h3>循环赛积分（前2晋级决赛，平分你现场裁定）</h3>
    <table><tr><th>#</th><th>队伍</th><th>胜</th><th>负</th></tr>${rows}</table></div>`;
  html += `</div></div>`;

  html += `<div class="section-label final">总决赛</div>`;
  html += `<div class="scroll"><div class="bracket">`;
  html += `<div class="col">${matchHtml(FINAL_ID,"决赛")}</div>`;
  const champ = (RESULTS[FINAL_ID]&&RESULTS[FINAL_ID].winner!=null)?RESULTS[FINAL_ID].winner:null;
  if(champ!=null){
    html += `<div class="col"><div class="col-title">冠军</div>
      <div class="match"><div class="team win"><span class="nm champ">🏆 ${esc(teamName(champ))}</span></div></div></div>`;
  }
  html += `</div></div>`;

  $("app").innerHTML = html;
  bindDrag();
}

// ===== 拖拽（裁判模式）=====
let dragGroup = null;
function bindDrag(){
  if(!isJudge) return;
  document.querySelectorAll(".team[data-slot]").forEach(el=>{
    el.addEventListener("dragstart", e=>{
      dragGroup = el.dataset.group ? parseInt(el.dataset.group,10) : null;
      if(dragGroup==null){ e.preventDefault(); return; }
      el.classList.add("dragging");
      e.dataTransfer.effectAllowed = "copy";
      try{ e.dataTransfer.setData("text/plain", String(dragGroup)); }catch(_){}
    });
    el.addEventListener("dragend", ()=>{ el.classList.remove("dragging"); dragGroup=null;
      document.querySelectorAll(".dropok").forEach(x=>x.classList.remove("dropok")); });
    el.addEventListener("dragover", e=>{ if(dragGroup!=null){ e.preventDefault(); el.classList.add("dropok"); } });
    el.addEventListener("dragleave", ()=> el.classList.remove("dropok"));
    el.addEventListener("drop", async e=>{
      e.preventDefault(); el.classList.remove("dropok");
      const g = dragGroup!=null?dragGroup:parseInt(e.dataTransfer.getData("text/plain"),10);
      if(isNaN(g)) return;
      await setOverride(el.dataset.slot, g);
    });
  });
}

async function setOverride(slotKey, group){
  try{
    const r = await fetch(REST+"/overrides", {
      method:"POST",
      headers:Object.assign({},H,{"Prefer":"resolution=merge-duplicates,return=representation"}),
      body:JSON.stringify({slot_key:slotKey, group_no:group})
    });
    if(!r.ok){ setStatus("调位失败 "+r.status,"err"); return; }
    OV[slotKey] = group;
    setStatus("已调整："+slotKey+" → "+teamName(group),"ok");
    render();
  }catch(e){ setStatus("网络错误："+e.message,"err"); }
}

$("clearOvBtn").addEventListener("click", async ()=>{
  if(!confirm("清除所有手动调位，恢复自动推导？")) return;
  try{
    await fetch(REST+"/overrides?slot_key=neq.__never__", {method:"DELETE", headers:H});
    OV = {}; setStatus("已恢复自动推导","ok"); render();
  }catch(e){ setStatus("清除失败："+e.message,"err"); }
});

// ===== 记分 =====
async function recordWin(mid, winner){
  try{
    const r = await fetch(REST+"/matches", {
      method:"POST",
      headers:Object.assign({},H,{"Prefer":"resolution=merge-duplicates,return=representation"}),
      body:JSON.stringify({match_id:mid, winner:winner, score_a:0, score_b:0, updated_at:new Date().toISOString()})
    });
    if(!r.ok){ setStatus("记分失败 "+r.status,"err"); return; }
    RESULTS[mid] = {winner};
    setStatus("已记录：本场胜者 "+teamName(winner),"ok");
    render();
  }catch(e){ setStatus("网络错误："+e.message,"err"); }
}

// ===== 撤销本场 =====
async function undoMatch(mid){
  const cur = RESULTS[mid];
  if(!cur || cur.winner==null){ setStatus("这场还没结果，无需撤销"); return; }
  const won = teamName(cur.winner);
  if(!confirm("确定撤销「"+ (mid) +"」这场结果吗？\n（原胜者："+won+"，撤销后本场回到未决，后续依赖它的对阵也会回退到待定）")) return;
  try{
    const r = await fetch(REST+"/matches?match_id=eq."+encodeURIComponent(mid), {method:"DELETE", headers:H});
    if(!r.ok){ setStatus("撤销失败 "+r.status,"err"); return; }
    delete RESULTS[mid];
    setStatus("已撤销 "+mid+"，可以重新点胜负了","ok");
    render();
  }catch(e){ setStatus("网络错误："+e.message,"err"); }
}

// ===== 点击 =====
document.addEventListener("click", async e=>{
  const ub = e.target.closest(".undo-btn");
  if(ub){ await undoMatch(ub.dataset.mid); return; }
  const wb = e.target.closest(".win-btn");
  if(wb){ await recordWin(wb.dataset.mid, parseInt(wb.dataset.win,10)); return; }

  const tm = e.target.closest(".team");
  if(!tm) return;

  // 搬移模式：第一下选中(必须有队伍)，第二下放到目标位
  if(isJudge && moveMode && tm.dataset.slot){
    const k = tm.dataset.slot;
    if(moveSrc===null){
      if(!tm.dataset.group){ setStatus("请先点一个有队伍的格子","err"); return; }
      moveSrc = k;
      setStatus("已选中 "+teamName(parseInt(tm.dataset.group,10))+"，再点目标位置放下（点自己取消）","ok");
      render(); return;
    }
    if(moveSrc===k){ moveSrc=null; setStatus("已取消选择"); render(); return; }
    const srcG = OV[moveSrc]!=null ? OV[moveSrc] : slotTeam(moveSrc.split(":")[0], moveSrc.split(":")[1]);
    if(srcG==null){ moveSrc=null; setStatus("源位置没队伍了","err"); render(); return; }
    moveSrc = null;
    await setOverride(k, srcG);
    return;
  }

  // 普通模式：点队伍看详情
  if(tm.dataset.group){ openTeam(parseInt(tm.dataset.group,10)); return; }
});

// 搬移模式开关
$("moveToggle").addEventListener("click", ()=>{
  moveMode = !moveMode; moveSrc = null;
  $("moveToggle").textContent = "搬移模式：" + (moveMode?"开":"关");
  document.body.classList.toggle("movemode", moveMode);
  setStatus(moveMode ? "搬移模式：点一个队伍，再点目标位置即可换位（手机也能用）" : "搬移模式已关闭", moveMode?"ok":"");
  render();
});

// ===== 队伍弹窗 =====
let editingGroup = null;
function openTeam(g){
  editingGroup = g;
  $("mTitle").textContent = teamName(g);
  $("mGrp").textContent = "第 "+g+" 组 · 5 名成员";
  const mem = MEMBERS[g] || [];
  $("mMembers").innerHTML = mem.length ? mem.map(n=>`<li>${esc(n)}</li>`).join("") : `<li style="color:#6d648f">名单加载中…</li>`;
  $("mNameInput").value = TEAMS[g] || "";
  $("overlay").classList.add("show");
}
$("mCancel").addEventListener("click", ()=> $("overlay").classList.remove("show"));
$("overlay").addEventListener("click", e=>{ if(e.target.id==="overlay") $("overlay").classList.remove("show"); });
$("mSave").addEventListener("click", async ()=>{
  const g = editingGroup, nm = $("mNameInput").value.trim();
  try{
    const r = await fetch(REST+"/teams", {
      method:"POST",
      headers:Object.assign({},H,{"Prefer":"resolution=merge-duplicates,return=representation"}),
      body:JSON.stringify({group_no:g, team_name:nm})
    });
    if(!r.ok){ setStatus("保存队名失败 "+r.status,"err"); return; }
    TEAMS[g] = nm; setStatus("队名已保存~","ok");
    $("overlay").classList.remove("show"); render();
  }catch(e){ setStatus("网络错误："+e.message,"err"); }
});

// ===== 裁判模式 =====
$("roleToggle").addEventListener("click", ()=>{
  if(isJudge){ isJudge=false; updateRole(); render(); return; }
  const pin = prompt("请输入裁判密码：");
  if(pin===JUDGE_PIN){ isJudge=true; updateRole(); render(); setStatus("裁判模式：可点「XX胜」记分，可拖动队伍改对阵","ok"); }
  else if(pin!=null){ setStatus("密码不对哦","err"); }
});
function updateRole(){
  $("roleLabel").textContent = isJudge ? "裁判模式（可记分/搬移）" : "观众模式";
  $("roleToggle").textContent = isJudge ? "退出裁判模式" : "切换裁判模式";
  $("clearOvBtn").style.display = isJudge ? "" : "none";
  $("moveToggle").style.display = isJudge ? "" : "none";
  if(!isJudge){ moveMode=false; moveSrc=null; document.body.classList.remove("movemode"); $("moveToggle").textContent="搬移模式：关"; }
}

// ===== 数据 =====
async function loadAll(){
  const [t,m,d,o] = await Promise.all([
    fetch(REST+"/teams?select=group_no,team_name",{headers:H,cache:"no-store"}),
    fetch(REST+"/matches?select=match_id,winner",{headers:H,cache:"no-store"}),
    fetch(REST+"/draws?select=name,group_no&group_no=lte.12&order=group_no.asc,created_at.asc",{headers:H,cache:"no-store"}),
    fetch(REST+"/overrides?select=slot_key,group_no",{headers:H,cache:"no-store"})
  ]);
  if(t.ok){ TEAMS={}; (await t.json()).forEach(x=>TEAMS[x.group_no]=x.team_name); }
  if(m.ok){ RESULTS={}; (await m.json()).forEach(x=>RESULTS[x.match_id]={winner:x.winner}); }
  if(d.ok){ MEMBERS={}; (await d.json()).forEach(x=>{ (MEMBERS[x.group_no]=MEMBERS[x.group_no]||[]).push(x.name); }); }
  if(o.ok){ OV={}; (await o.json()).forEach(x=>OV[x.slot_key]=x.group_no); }
}
$("refreshBtn").addEventListener("click", async ()=>{
  setStatus("刷新中…");
  try{ await loadAll(); render(); setStatus("已更新","ok"); }catch(e){ setStatus("刷新失败："+e.message,"err"); }
});

(async function init(){
  updateRole();
  try{ await loadAll(); render(); }catch(e){ setStatus("连接失败："+e.message,"err"); }
  setInterval(async ()=>{
    if($("overlay").classList.contains("show")) return;
    if(document.querySelector(".dragging")) return;
    try{ await loadAll(); render(); }catch(e){}
  }, 5000);
})();
</script>
